<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bombo Winmax · OBS</title>
  <link rel="stylesheet" href="/bombo/stage.css">
</head>
<body>
  <div id="stage">
    <canvas id="c" width="1920" height="1080"></canvas>

    <img id="logo" src="/brand/logo.png" alt="">
    <div id="title"><div class="t1">GRAN SORTEO</div><div class="t2" id="drawName"></div></div>
    <div id="badge" class="hidden">MODO ENSAYO</div>

    <div id="introLabels">
      <div class="ilabel a" id="labA"></div>
      <div class="ilabel b" id="labB"></div>
    </div>

    <aside id="panel" class="hidden">
      <div class="ptitle" id="pTitle"></div>
      <div class="prizeCard" id="prizeCard">
        <div class="k">AHORA SORTEAMOS</div>
        <div class="v" id="prizeLabel">—</div>
        <div class="r" id="prizeLeft"></div>
      </div>
      <div class="winner hidden" id="winnerCard">
        <div class="k">¡GANADOR!</div>
        <div class="user" id="wUser"></div>
        <div class="code" id="wCode"></div>
        <div class="prize" id="wPrize"></div>
      </div>
      <div class="wlist">
        <div class="k">GANADORES</div>
        <ol id="wl"></ol>
      </div>
    </aside>

    <section id="results" class="hidden">
      <div class="rtitle">🏆 GANADORES</div>
      <div class="rcols">
        <div class="rcol a" id="resA"><h3>🎃 Comodines Halloween</h3><ol></ol></div>
        <div class="rcol b" id="resB"><h3>🎁 Premios</h3><ol></ol></div>
      </div>
    </section>

    <div id="soundHint" class="hidden">🔊 Haz clic para activar el sonido</div>
  </div>

  <script src="/vendor/matter.min.js"></script>
  <script src="/bombo/bombo.js"></script>
  <script src="/bombo/overlay.js"></script>
</body>
</html>
